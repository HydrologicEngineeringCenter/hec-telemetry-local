plugins {
    id 'library.deps-conventions'
    id 'library.java-conventions'
    id 'library.publishing-conventions'
}

dependencies {
    api(platform(libs.opentelemetry.bom))
    api(libs.opentelemetry.api)
    implementation(libs.opentelemetry.sdk.extension.autoconfigure.spi)

    api(project(":local-telemetry-data-access"))

    runtimeOnly(project(":h2-telemetry-db"))

    testImplementation(libs.opentelemetry.sdk)
    testImplementation(libs.opentelemetry.sdk.testing)
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}